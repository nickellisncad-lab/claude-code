services:
  letterboxd-radarr-sync:
    build: .
    # Or, once you have pushed an image somewhere:
    # image: ghcr.io/nickellisncad-lab/letterboxd-radarr-sync:latest
    container_name: letterboxd-radarr-sync
    restart: unless-stopped
    env_file: .env
    # Run as the host user that owns ./data. setup.sh fills PUID/PGID in
    # from `id -u` / `id -g`; the 1000 fallback matches the image's own user.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # Holds state.db, which is what stops a restart from re-requesting
      # every film on both watchlists.
      - ./data:/data
    # Uncomment if Radarr runs in another compose stack on its own network.
    # networks:
    #   - radarr

# networks:
#   radarr:
#     external: true
